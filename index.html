<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Pac-Man</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <canvas id="game" aria-label="Pac-Man"></canvas>

    <div id="overlay" class="hidden">
      <div class="panel">
        <h1>GAME OVER</h1>
        <p class="score-line">SCORE <span id="finalScore">0</span></p>
        <button id="saveBtn" type="button">SAVE SCORE</button>
        <button id="againBtn" type="button">PLAY AGAIN</button>
        <p id="saveMsg" aria-live="polite"></p>
        <p class="hint">S = SAVE &middot; ENTER = PLAY AGAIN</p>
      </div>
    </div>
  </div>

  <p id="help">ARROWS / WASD / SWIPE: MOVE &middot; P: PAUSE &middot; M: SOUND</p>

  <script src="script.js"></script>
</body>
</html>
